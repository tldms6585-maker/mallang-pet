name: Build Mallang Pet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug file list
        run: |
          echo "=== app ==="
          ls -la app/
          echo "=== app/src ==="
          ls -la app/src/
          echo "=== app/src/main ==="
          ls -la app/src/main/
          echo "=== find manifest ==="
          find . -iname "*manifest*" -not -path "./.git/*"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MallangPet-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
